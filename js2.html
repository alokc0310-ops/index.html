<!DOCTYPE html>
<html lang="en">
<head>
   
    
    <title>Factorial</title>
</head>
<script type="text/javascript">
    function fact(x)
    {
        a=1;
        f=1
        while(a<=x)
    {
        f=f*a
        a=a+1
    }
    document.write("factorial is "+f)
    }
</script>

<body>
   <script type="text/javascript">
    n=parseInt(prompt("Enter a no for factorial"))
    fact(n)
   </script> 
</body>
</html>
