<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script language="javascript">
        function table(b)
        {
            for(i=1;i<=10;i++)
            document.write(i*b,"<br>")
        return None;
        }
    </script>
</head>
<body>
   <script language="javascript">
    a=prompt("Input no for table")
    document.write(table(a));
   </script> 
</body>
</html>
