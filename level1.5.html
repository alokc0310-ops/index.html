
<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Practise level 4</title>
    <style>
        .box{
            height: 100px;
            width: 100px;
            margin: 5px;
            padding: 5px;
            background-color: aqua;
            border: 2px dotted red;
        }
        #first_button{
            padding: 10px 15px;
            margin: 100px;
            height: 70px;
            width: 70px;
            border: 2px dotted red;
            border-radius:35px;
        }
    </style>
</head>
<body>
    <div class="box" style="box-sizing: content-box; " >Box1</div>
    <div class="box" style="box-sizing: border-box;">Box2</div>
    <button id="first_button">Click me</button>
</body>
</html>
